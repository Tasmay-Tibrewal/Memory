# =============================================================================
# Reference: Full Configuration Surface (Documentation YAML)
# =============================================================================
# Purpose:
# - Show every supported config key in one place.
# - Provide sane defaults and short comments for non-obvious knobs.
#
# Notes:
# - This file is valid to load, but intended as documentation first.
# - For practical runs, start from base_small.yaml / adapter_qwen2.5_1.5b.yaml.
# =============================================================================

model:
  # Core architecture (from-scratch path)
  hidden_dim: 768
  num_heads: 12
  num_kv_heads: null              # GQA KV heads; null => num_heads
  num_layers: 12
  intermediate_dim: 3072
  vocab_size: 32000
  max_seq_len: 8192
  max_position_embeddings: null   # Optional alias; overrides max_seq_len when set

  # Tokenizer and special IDs
  tokenizer_name: null            # null => base_model_name (adapter) or TinyLlama tokenizer (scratch)
  bos_token_id: null
  eos_token_id: null
  pad_token_id: null

  # Attention + regularization
  use_rope: true
  rope_theta: 10000.0
  dropout: 0.0
  attention_dropout: 0.0
  hidden_activation: swiglu       # swiglu/silu/relu/gelu/sigmoid/tanh
  initializer_range: 0.02         # Std for from-scratch Linear/Embedding initialization

  # Norm + output head
  norm_eps: 1e-6
  use_rms_norm: true
  tie_embeddings: true            # Tie input embedding and LM head

  # Adapter mode
  base_model_name: null
  freeze_base_model: true

  # Performance
  use_flash_attention: true

memory:
  # Master toggles
  vanilla_mode: false             # true => disable all memory components
  use_memory_adapter: true
  use_both_memory_and_lora: false

  # Memory bank
  num_memory_tokens: 1024
  memory_dim: null                # null => hidden_dim
  memory_num_heads: null          # null => model.num_heads for memory cross-attn
  memory_num_kv_heads: null       # null => model.num_kv_heads (or model.num_heads if null)

  # Placement
  memory_layer_placement: all     # all/first_k/last_k/every_n/custom/none
  memory_layer_k: 5
  memory_layer_n: 3
  memory_layer_indices: null

  # Sharing
  memory_sharing: shared          # shared/per_layer/every_k_layers
  memory_sharing_k: 2

  # Block + memory attention
  memory_block_variant: A         # A or B
  memory_dropout: null            # null => model.dropout
  memory_gradient_checkpointing: true

  # Low-rank memory
  use_low_rank_memory: false
  memory_rank: 64
  low_rank_mode: factorized       # factorized/reduced_dim
  use_low_rank_projections: false
  projection_rank: 64

  # Chapter routing
  use_chapters: false
  num_chapters: 100
  top_k_chapters: 20
  num_shared_chapters: 0           # Always include first N chapters for every sample
  routed_scaling_factor: 1.0       # Scale routed chapter weights vs shared chapter weights
  normalize_shared_routed_before_mixing: false  # Normalize shared/routed vectors separately before weighted mixing
  shared_routed_norm_type: rms     # rms/layernorm
  shared_routed_norm_eps: 1e-6
  routing_strategy_train: sequence      # sequence/sequence-rolling/token
  routing_strategy_inference: sequence  # sequence/sequence-rolling/rolling/token/hybrid
  routing_window_size: 128

  # Router losses
  use_load_balance_loss: true
  load_balance_coefficient: 0.01
  use_auxiliary_loss: false
  auxiliary_loss_coefficient: 0.01
  use_z_loss: false
  z_loss_coefficient: 0.001

  # Quantization (inference/eval workflows)
  quantize_memory: false
  memory_quant_bits: 8            # 4 or 8

  # Init
  wo_init_zero: true
  memory_init_std: 0.02

  # LoRA
  use_lora: false
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets:
    - q_proj
    - v_proj

training:
  # Learning rates
  memory_lr: 1e-4
  lora_lr: 1e-4
  base_model_lr: 1e-5

  # Training mode
  training_mode: instruction_finetuning  # instruction_finetuning/pretraining

  # Dataset
  dataset_name: HuggingFaceH4/ultrachat_200k
  dataset_subset: null
  dataset_split: train
  eval_split: test
  text_field: messages             # string or list
  max_length: 8192

  # Distributed
  distributed_strategy: ddp        # ddp/fsdp
  num_gpus: 1
  fsdp_sharding_strategy: FULL_SHARD

  # Steps and batching
  batch_size: 4
  gradient_accumulation_steps: 4
  num_epochs: null
  max_steps: 10000
  warmup_steps: 100
  warmup_ratio: null

  # Optimizer
  optimizer: adamw                 # adamw/adam/sgd
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  max_grad_norm: 1.0              # gradient clipping

  # Scheduler
  scheduler: cosine                # cosine/linear/constant/wsd
  min_lr_ratio: 0.1
  decay_start_step: null           # optional delayed decay start (absolute)
  decay_start_ratio: null          # optional delayed decay start (fraction of total steps)
  wsd_stable_steps: null           # warmup-stable-decay stable span
  wsd_stable_ratio: 0.0

  # Precision
  mixed_precision: bf16            # no/fp16/bf16
  save_precision: null             # fp32/fp16/bf16

  # Checkpointing + eval cadence
  gradient_checkpointing: true
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3             # null => keep all checkpoints (no cleanup)
  save_best_model: true

  # Early stopping
  early_stopping: false
  early_stopping_patience: 5
  early_stopping_threshold: 0.0

  # Logging
  logging_steps: 10
  log_to_wandb: false
  wandb_project: memory-transformer
  wandb_run_name: null

  # Output
  output_dir: ./outputs
  resume_from_checkpoint: null

# -----------------------------------------------------------------------------
# Optional quick recommendations (copy into a real run config):
# - From-scratch small: hidden_dim=512-768, num_layers=6-12, num_memory_tokens=512-4096
# - Adapter memory: freeze_base_model=true, num_memory_tokens=1024-2048, memory_lr=2e-4
# - WSD schedule: scheduler=wsd, warmup_ratio=0.02-0.05, wsd_stable_ratio=0.2-0.4
# -----------------------------------------------------------------------------
