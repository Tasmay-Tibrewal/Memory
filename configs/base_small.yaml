# =============================================================================
# Memory-Augmented Transformer: Small From-Scratch Model
# =============================================================================
# This config trains a small (~100M param) memory-augmented transformer
# from scratch for research experiments.
#
# Usage: python scripts/train.py --config configs/base_small.yaml
# =============================================================================

model:
  # Architecture
  hidden_dim: 576
  num_heads: 9
  num_kv_heads: 3 # GQA KV heads (null => use num_heads)
  num_layers: 30
  intermediate_dim: 1536
  vocab_size: 49152
  max_seq_len: 8192
  max_position_embeddings: null # Optional alias; if set it overrides max_seq_len

  # Tokenizer (must match vocab_size for from-scratch)
  tokenizer_name: HuggingFaceTB/SmolLM2-135M-Instruct
  bos_token_id: 0
  eos_token_id: 0
  pad_token_id: 0

  # Standard settings
  use_rope: true
  rope_theta: 100000.0
  dropout: 0.0
  attention_dropout: 0.0
  hidden_activation: swiglu
  initializer_range: 0.02
  tie_embeddings: true
  use_rms_norm: true
  norm_eps: 1e-5
  use_flash_attention: true

  # Not using pretrained base (from-scratch)
  base_model_name: null
  freeze_base_model: false

memory:
  # === MAIN TOGGLE: Set to true for vanilla (no memory) control ===
  vanilla_mode: false

  # Memory bank settings
  num_memory_tokens: 65536
  memory_dim: null # Uses hidden_dim
  memory_num_heads: null # null => fallback to model.num_heads for memory cross-attn
  memory_num_kv_heads: null # null => fallback to model.num_kv_heads (or model.num_heads if null)

  # Memory placement: all layers get memory
  memory_layer_placement: all
  memory_sharing: shared # Single shared bank
  memory_block_variant: A # SA -> Mem -> MLP
  memory_dropout: null # null => fallback to model.dropout for memory cross-attention

  memory_gradient_checkpointing: true

  # Chapter routing (MoE-style sparse access)
  use_chapters: true
  num_chapters: 260 # 256 (to be routed) + 4 (shared)
  top_k_chapters: 16
  num_shared_chapters: 4 # First N chapters are always included for every sample
  routed_scaling_factor: 10 # Scales routed chapter weights relative to shared chapters
  normalize_shared_routed_before_mixing: true # Normalize shared/routed vectors separately before weighted mixing
  shared_routed_norm_type: rms # rms/layernorm
  shared_routed_norm_eps: 1e-6
  # scaled to 10, because 4 shared chapters weighed as 4, and 16 routed chapter as 1
  # so to compensate, we need 4x by default, then since we want to rely more on routed chapters, we scale them by 2.5x further
  # 4 * 2.5 = 10, this 2.5x taken from glm-4.7 config, and is sp. imp. for us, because we need to rely heavily on sparse knowledge.
  # giving more imp. to routed tokens and lesser to shared common ones.
  routing_strategy_train: sequence
  routing_strategy_inference: sequence

  # Router losses
  use_load_balance_loss: true
  load_balance_coefficient: 0.01
  use_auxiliary_loss: false
  use_z_loss: false

  # Low-rank options (disabled for full expressiveness)
  use_low_rank_memory: false
  # memory_rank: 256
  # low_rank_mode: factorized

  # Initialization
  wo_init_zero: true
  memory_init_std: 0.02

  # LoRA (disabled for from-scratch)
  use_lora: false
  use_memory_adapter: true
  use_both_memory_and_lora: false

training:
  # Learning rates
  memory_lr: 3e-4
  lora_lr: 3e-4
  base_model_lr: 3e-4 # Same for from-scratch

  # Training mode
  training_mode: pretraining

  # === DATASET SUGGESTIONS ===
  # Uncomment ONE of these dataset configurations:

  # Option 1: General pretraining (recommended for from-scratch)
  dataset_name: allenai/c4
  dataset_subset: en
  dataset_split: train
  eval_split: validation # c4 has train/validation splits
  text_field: text

  # Option 2: SlimPajama (high quality)
  # dataset_name: cerebras/SlimPajama-627B
  # dataset_split: train
  # text_field: text

  # Option 3: RedPajama
  # dataset_name: togethercomputer/RedPajama-Data-1T-Sample
  # dataset_split: train
  # text_field: text

  # Option 4: Wikipedia for testing
  # dataset_name: wikipedia
  # dataset_subset: 20220301.en
  # dataset_split: train
  # text_field: text

  max_length: 2048 # Shorter for pretraining efficiency

  # Distributed
  distributed_strategy: ddp
  # num_gpus: 1

  # Training hyperparameters
  batch_size: 128
  gradient_accumulation_steps: 4 # smaller, since smaller train corpus
  # num_epochs: null
  max_steps: 10000 # 10k steps for 10B tokens (128 * 4 * 2048 => 1M tokens * 10k = 10B tokens)
  warmup_steps: 500 # smaller warmup for smaller training corpus

  # Optimizer
  optimizer: adamw
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1e-8
  max_grad_norm: 1.0

  # Scheduler
  scheduler: WSD
  min_lr_ratio: 0.1
  # wsd_stable_ratio is over-riden by decay_start_ratio and warmup_steps
  wsd_stable_ratio: 0.0  # Warmup -> x% stable (or auto stable min to 0, if over-written) -> decay
  decay_start_ratio: 0.8 # Optional global override for decay start (ratio of steps till decay start)
  # resolved decay start overrides stable, stable = total - (warmup + decay steps)
  # decay_start_step: 2000

  # Mixed precision
  mixed_precision: bf16

  # Checkpointing
  gradient_checkpointing: true
  save_steps: 2000
  eval_steps: 100
  save_total_limit: 3 # Set null to keep all checkpoints

  # Logging
  logging_steps: 10
  log_to_wandb: true
  wandb_project: memory-transformer
  wandb_run_name: run-full-pretrain

  # Output
  output_dir: ./outputs/base_small
  resume_from_checkpoint: null
