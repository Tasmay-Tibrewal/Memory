model:
  hidden_dim: 768
  num_heads: 12
  num_kv_heads: 4
  num_layers: 24
  intermediate_dim: 2304
  vocab_size: 49152
  max_seq_len: 2048
  max_position_embeddings: 2048
  tokenizer_name: HuggingFaceTB/SmolLM2-135M-Instruct
  bos_token_id: 0
  eos_token_id: 0
  pad_token_id: 0
  use_rope: true
  rope_theta: 100000.0
  dropout: 0.0
  attention_dropout: 0.0
  hidden_activation: swiglu
  initializer_range: 0.02
  self_attn_wo_init_std: 0.00378
  mlp_down_proj_init_std: 0.00378
  norm_eps: 1.0e-05
  use_rms_norm: true
  base_model_name: null
  freeze_base_model: false
  use_flash_attention: true
  tie_embeddings: true
memory:
  vanilla_mode: true
  num_memory_tokens: 262208
  memory_dim: null
  memory_num_heads: 12
  memory_num_kv_heads: 12
  memory_layer_placement: custom
  memory_layer_k: 5
  memory_layer_n: 3
  memory_layer_indices:
  - 2
  - 6
  - 10
  - 14
  memory_sharing: shared
  memory_sharing_k: 2
  memory_block_variant: A
  memory_dropout: null
  use_low_rank_memory: false
  memory_rank: 64
  low_rank_mode: factorized
  use_low_rank_projections: false
  projection_rank: 64
  use_chapters: true
  num_chapters: 4097
  top_k_chapters: 64
  num_shared_chapters: 1
  routed_scaling_factor: 2.5
  normalize_shared_routed_before_mixing: true
  shared_routed_norm_type: rms
  shared_routed_norm_eps: 1.0e-05
  routing_strategy_train: sequence
  routing_strategy_inference: sequence
  routing_window_size: 128
  token_routing_kernel_version: v2
  use_load_balance_loss: true
  load_balance_coefficient: 0.01
  use_auxiliary_loss: false
  auxiliary_loss_coefficient: 0.01
  use_z_loss: true
  z_loss_coefficient: 0.001
  memory_gradient_checkpointing: true
  quantize_memory: false
  memory_quant_bits: 8
  wo_init_zero: true
  memory_init_std: 0.02
  use_lora: false
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets:
  - q_proj
  - v_proj
  use_memory_adapter: true
  use_both_memory_and_lora: false
training:
  memory_lr: 1.5e-05
  memory_bank_lr: 5.0e-06
  lora_lr: 3.0e-05
  base_model_lr: 3.0e-05
  training_mode: instruction_finetuning
  dataset_name: HuggingFaceH4/ultrachat_200k
  dataset_subset: null
  dataset_split: train_sft
  eval_split: test_sft
  text_field: messages
  max_length: 2048
  distributed_strategy: ddp
  num_gpus: 4
  fsdp_sharding_strategy: FULL_SHARD
  batch_size: 32
  gradient_accumulation_steps: 1
  num_epochs: 2
  max_steps: 10000
  warmup_steps: 250
  warmup_ratio: null
  optimizer: adamw
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  scheduler: cosine
  min_lr_ratio: 0.1
  decay_start_step: null
  decay_start_ratio: null
  wsd_stable_steps: null
  wsd_stable_ratio: 0.0
  mixed_precision: bf16
  save_precision: null
  gradient_checkpointing: true
  save_steps: 100
  eval_steps: 100
  save_total_limit: 100
  save_best_model: true
  early_stopping: false
  early_stopping_patience: 5
  early_stopping_threshold: 0.0
  logging_steps: 10
  log_to_wandb: true
  wandb_project: memory-transformer
  wandb_run_name: run-vanilla-ift-run1
  output_dir: ./outputs/vanilla_control_ift_run1
